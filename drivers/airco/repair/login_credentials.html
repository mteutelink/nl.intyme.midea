<html>

<body>
	<script type="application/javascript">
		$(document).ready( function() {
			const navBarFromLoginCredentials = document.getElementById("hy-nav");
			if(navBarFromLoginCredentials) {
				navBarFromLoginCredentials.remove();
			}
		});
		function login(event) {
			event.preventDefault();

			Homey.showLoadingOverlay();

			Homey.emit('login', {
					username: document.getElementById("username").value,
					password: document.getElementById("password").value,
                        provider: document.getElementById("provider").value
				},
				function (error, device) {
					if (error) {
						Homey.error(error);
					} else if (!device) {
						Homey.error(Homey.__("repair.error_repairing_device"));
					}
					Homey.hideLoadingOverlay();
				},
			);
		};
	</script>

	<div id="login-credentials">
		<form id="login-credentials-form" class="homey-form">
			<h1 id="login-credentials-title" class="homey-title homey-text-align-center"
				data-i18n="repair.login_credentials.title">Log in with your device</h1>
			<span data-i18n="repair.login_credentials.message"></span>
            <div class="homey-form-group-large">
                <label class="homey-form-label" for="provider"
                    data-i18n="repair.login_credentials.providerLabel">Account provider</label>
                <select class="homey-form-select" id="provider" name="provider">
                    <option value="nethomeplus">NetHome Plus</option>
                    <option value="msmarthome">MSmartHome / SmartHome</option>
                </select>
            </div>
			<div class="homey-form-group-large">
				<label class="homey-form-label" for="username" data-i18n="repair.login_credentials.usernameLabel">E-mail
					address</label>
				<input class="homey-form-input-large" id="username" name="username" type="text"/>
				
			</div>
			<div class="homey-form-group-large">
				<label class="homey-form-label" for="password"
					data-i18n="repair.login_credentials.passwordLabel">Password</label>
				<input class="homey-form-input-large" id="password" name="password" type="password"/>
			</div>
			<button class="homey-button-primary-shadow-full" onclick="login(event)">Log in</button>
		</form>
	</div>
</body>

</html>
